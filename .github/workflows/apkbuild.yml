name: APK Build CI

on:
  push:
    branches:
      - main
      - 'foundation/**'
  pull_request:

permissions:
  contents: read

jobs:
  apkbuild:
    name: Build Alpine APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build package on Alpine 3.24
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts" \
            alpine:3.24 \
            sh -euxc '
              apk update
              apk add alpine-sdk atools-go

              printf "%s\n" \
                "PACKAGER=\"Luiz A. S. Correa <luizascorrea@hotmail.com>\"" \
                >> /etc/abuild.conf

              adduser -D builder
              addgroup builder abuild

              mkdir -p \
                /home/builder/aport \
                /var/cache/distfiles

              cp /workspace/packaging/alpine/APKBUILD \
                /home/builder/aport/APKBUILD

              cd /home/builder/aport
              apkbuild-lint APKBUILD

              chgrp abuild /var/cache/distfiles
              chmod g+w /var/cache/distfiles
              chown -R builder:builder /home/builder

              su builder -c "abuild-keygen -a -n"

              cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/

              su builder -c \
                "cd /home/builder/aport && abuild -r"

              printf "\n=== APK GERADO ===\n"
              find /home/builder/packages \
                -type f \
                -name "*.apk" \
                -print

              apk_file="$(
                find /home/builder/packages \
                  -type f \
                  -name "lasc-os-[0-9]*.apk" \
                  -print \
                  -quit
              )"

              doc_apk="$(
                find /home/builder/packages \
                  -type f \
                  -name "lasc-os-doc-*.apk" \
                  -print \
                  -quit
              )"

              test -n "$apk_file"
              test -n "$doc_apk"

              printf "\n=== TESTE DE INSTALAÇÃO ===\n"
              apk add "$apk_file"

              test -x /usr/bin/lasc-version
              test -x /usr/bin/lasc-help

              lasc-version
              lasc-help >/dev/null

              set -- /usr/bin/lasc-*
              test "$#" -eq 17

              printf "Comandos LASC instalados: %s\n" "$#"

              cp "$apk_file" "$doc_apk" /artifacts/
            '

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lasc-os-apk
          path: artifacts/lasc-os-*.apk
          if-no-files-found: error
